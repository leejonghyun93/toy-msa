name: Spring Cloud MSA CI/CD Pipeline

# 이 워크플로우가 실행되는 이벤트
on:
  push:
    branches:
      - main  # main 브랜치에 push가 있을 때 CI/CD 실행
  pull_request:
    branches:
      - main  # main 브랜치로 PR 생성 시에도 실행

jobs:
  build:
    # 빌드할 환경 지정 (ubuntu 최신 버전에서 실행)
    runs-on: ubuntu-latest

    steps:
      # 1. 코드 체크아웃
      - name: Check out code
        uses: actions/checkout@v2

      # 2. JDK 17 설정 (distribution 파라미터 추가)
      - name: Set up JDK 17
        uses: actions/setup-java@v2
        with:
          java-version: '17'
          distribution: 'adoptopenjdk'  # 또는 'adoptium'

      # 3. Maven 빌드
      - name: Build with Maven
        run: mvn clean install -DskipTests

      # 4. 테스트 실행
      - name: Run tests
        run: mvn test

      # 5. Docker 이미지 빌드 (선택 사항, 현재 사용하지 않음)
      # - name: Build Docker image
      #   run: |
      #     docker build -t your-image-name .
      #     docker tag your-image-name your-docker-repo/your-image-name:latest

      # 6. Docker Hub에 이미지 푸시 (선택 사항, 현재 사용하지 않음)
      # - name: Push Docker image
      #   run: |
      #     echo $DOCKER_PASSWORD | docker login --username $DOCKER_USERNAME --password-stdin
      #     docker push your-docker-repo/your-image-name:latest